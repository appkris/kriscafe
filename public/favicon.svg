<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232D"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A04E"/>
      <stop offset="100%" stop-color="#C9782F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#E08A3C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#2B3240" stroke-width="4"/>

  <!-- Coffee Cup Core Icon -->
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Steam Lines -->
    <path d="M70 20 C60 0, 80 -20, 70 -40" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M140 10 C130 -10, 150 -30, 140 -50" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <path d="M210 20 C200 0, 220 -20, 210 -40" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

    <!-- Cup Body -->
    <path d="M20 50 L260 50 C260 170, 220 220, 140 220 C60 220, 20 170, 20 50 Z" fill="url(#accentGrad)"/>

    <!-- Cup Rim Top -->
    <ellipse cx="140" cy="50" rx="120" ry="16" fill="#FAD19E"/>

    <!-- Coffee Liquid Inside -->
    <ellipse cx="140" cy="50" rx="104" ry="12" fill="#4A2511"/>
    <ellipse cx="140" cy="50" rx="80" ry="8" fill="#6B381A" opacity="0.8"/>

    <!-- Cup Handle -->
    <path d="M245 75 C295 75, 295 165, 240 165" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Saucer / Base Plate -->
    <path d="M10 240 L270 240 C280 240, 290 250, 275 258 C230 280, 50 280, 5 258 C-10 250, 0 240, 10 240 Z" fill="#2E3543"/>
    <ellipse cx="140" cy="242" rx="130" ry="6" fill="#3D4759"/>
  </g>

  <!-- Badge Text / Subtitle -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#F3F4F6" text-anchor="middle" letter-spacing="4">KRISCAFE</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" fill="#E08A3C" text-anchor="middle" letter-spacing="3">POINT OF SALE</text>
</svg>
